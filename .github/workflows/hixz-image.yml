# fork（hixz12d/codex-proxy-rs）专用的镜像构建，只能手动触发。
# 原版的 CI、Release 等工作流在 fork 上已停用，本工作流不签名、不扫描、不发 GitHub Release，
# 只从源码构建 runtime 阶段的 linux/amd64 镜像并推送到 ghcr.io/<仓库小写>。
name: Hixz Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Program version, for example 3.19.0+hixz.1 ("+" becomes "-" in the image tag)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: hixz-image-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    # 首次构建没有 cargo 缓存，前后端都在镜像内从源码编译，约 30~60 分钟
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version and tags
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION#v}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$version" =~ $semver ]]; then
            echo "::error::version '${INPUT_VERSION}' is not a valid SemVer, for example 3.19.0+hixz.1"
            exit 1
          fi
          # Docker 标签不允许 "+"，构建标记映射为 "-"；程序内版本号保留原值
          docker_version="${version//+/-}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          short_sha="${GITHUB_SHA:0:7}"
          {
            echo "version=${version}"
            echo "docker_version=${docker_version}"
            echo "image=${image}"
            echo "short_sha=${short_sha}"
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          # 不附加 provenance/SBOM，推送结果是单一平台清单，digest 可直接用于服务器核对
          provenance: false
          sbom: false
          build-args: |
            CPR_VERSION=${{ steps.meta.outputs.version }}
            CPR_GIT_SHA=${{ github.sha }}
            CPR_BUILD_TIME=${{ steps.meta.outputs.build_time }}
            CPR_BUILD_TYPE=release
          # Dockerfile 里的 cargo cache mount 不会跨 GHA 运行保留，这里只缓存镜像层
          cache-from: type=gha,scope=hixz-runtime
          cache-to: type=gha,mode=max,scope=hixz-runtime
          labels: |
            org.opencontainers.image.title=Codex Proxy RS
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.docker_version }}
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}

      - name: Record image digest
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          DOCKER_VERSION: ${{ steps.meta.outputs.docker_version }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::missing or invalid image digest: '${IMAGE_DIGEST}'"
            exit 1
          fi
          {
            echo "## Image"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Program version | \`${VERSION}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Tags | \`${IMAGE}:${DOCKER_VERSION}\`, \`${IMAGE}:sha-${SHORT_SHA}\` |"
            echo "| Digest | \`${IMAGE_DIGEST}\` |"
            echo
            echo "\`\`\`"
            echo "docker pull ${IMAGE}@${IMAGE_DIGEST}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
